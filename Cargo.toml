[package]
name = "Abk-WingetApp"
version = "0.6.1"
edition = "2021"

[dependencies]
eframe = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
embed-resource = "2.5"

# Ab 0.6.0: Transportverschlüsselung über TLS (rustls) mit selbstsignierten
# Zertifikaten (rcgen). Pro PC wird beim ersten Start ein Zertifikat erzeugt;
# der private Schlüssel wird über die Windows-Datenschutz-API (DPAPI) gespeichert.
# `ring` als Krypto-Backend (statt aws_lc_rs), weil sich `ring` unter Windows
# ohne zusätzliche C-Toolchain baut. `tls12` bleibt zur Kompatibilität mit alten
# Geräten aktiv; Standard ist TLS 1.3.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
